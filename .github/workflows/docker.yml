name: Publish Docker image

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Build, smoke-test and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: virtualflybrain/catmaid
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Resolve primary image tag
        run: |
          FIRST_TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "FIRST_TAG=$FIRST_TAG" >> "$GITHUB_ENV"

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test (verify GA injection)
        # This image is feed-only: in production it requires a *.pgsql
        # dump to be mounted at /backup and piped into catmaid-entry.sh
        # before the service comes up. CI has no such fixture, so we
        # skip the live HTTP test and instead exercise just the moving
        # part this branch adds — the inject_gtm.py runtime template
        # patch — by running it with an overridden entrypoint and
        # grepping the resulting templates.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash "$FIRST_TAG" -c '
            set -euo pipefail
            echo "--- inject_gtm.py present ---"
            ls -la /opt/VFB/inject_gtm.py
            echo "--- GA_TAG_ID default ---"
            printenv GA_TAG_ID
            echo "--- run injection ---"
            python3 /opt/VFB/inject_gtm.py
            echo "--- assert marker present in both templates ---"
            grep -q VFB-GA-INJECTED /home/django/applications/catmaid/templates/catmaid/index.html
            grep -q VFB-GA-INJECTED /home/django/applications/catmaid/templates/catmaid/base.html
            echo "--- assert configured GA_TAG_ID appears in injected snippet ---"
            grep -q "$(printenv GA_TAG_ID)" /home/django/applications/catmaid/templates/catmaid/index.html
            grep -q "$(printenv GA_TAG_ID)" /home/django/applications/catmaid/templates/catmaid/base.html
            echo "--- assert idempotency (second run is a no-op) ---"
            python3 /opt/VFB/inject_gtm.py
            test $(grep -c VFB-GA-INJECTED /home/django/applications/catmaid/templates/catmaid/index.html) -eq 1
            test $(grep -c VFB-GA-INJECTED /home/django/applications/catmaid/templates/catmaid/base.html) -eq 1
            echo "OK"
          '

      - name: Scan image for known vulnerabilities
        # Report-only for now (exit-code 0). Flip --exit-code to 1 once the
        # baseline is clean to gate the build on regressions. Invoking trivy
        # via its own Docker image to avoid the trivy-action versioning
        # churn; aquasec/trivy publishes stable versioned tags on Docker Hub.
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache \
            aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --vuln-type os,library \
              --format table \
              --exit-code 0 \
              "$FIRST_TAG"

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
